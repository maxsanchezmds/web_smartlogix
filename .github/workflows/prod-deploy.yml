name: "Web Production Deploy"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  WEB_DEPLOY_CONTRACT_PREFIX: /smartlogix/web/deploy

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    concurrency:
      group: web-prod-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Configure AWS credentials (static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.ACCESS_KEY_SECRET }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy frontend
        id: deploy
        run: |
          chmod +x .github/scripts/deploy_prod.sh
          .github/scripts/deploy_prod.sh

      - name: Print URL
        run: echo "Frontend URL: ${{ steps.deploy.outputs.app_url }}"
